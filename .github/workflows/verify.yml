name: verify
# The per-branch checks of a fix, off the local machine: the suite in
# slices, infer-test, both probes, the corpus C diff against BASE, and a
# new test under --int-overflow=promote and SPINEL_GC_STRESS=1. Edit
# verify.conf and push this branch, or dispatch by hand.
#
# Each sha is built once, by the build job, and the legs unpack its tree.
# Every make-driven compile goes through sccache, as upstream CI's do: the
# build and each suite slice carry sccache's disk store between runs as one
# actions/cache entry per lane. The base's results (both probes, the rubyspec
# gate, the C the base emits for each corpus program) are cached by the base
# sha, the leg, the runner (image, ruby, cc) and the files of this branch that
# make them; the report says which came from the cache.
on:
  push:
    branches: [verify]
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      builds: ${{ steps.m.outputs.builds }}
      label: ${{ steps.m.outputs.label }}
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          set -a; . ./verify.conf; set +a
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          heads = [h.split("=", 1) for h in os.environ["HEADS"].split()]
          legs = os.environ["LEGS"].split()
          n = int(os.environ.get("SHARDS", "4"))
          base = os.environ["BASE"]
          # "base" names the base's tree and its jobs
          assert all(name != "base" for name, _ in heads), "a head may not be called base"
          # the rubyspec gate in shards of suites (the Run step's case)
          rs = [{"leg": "rubyspec", "shard": k} for k in (1, 2, 3)] if "rubyspec" in legs else []
          jobs = []
          for leg in ("cb", "vf"):
              if leg in legs:
                  jobs.append({"leg": leg, "name": "base", "sha": base, "shard": 0})
          jobs += [dict(j, name="base", sha=base) for j in rs]
          for name, sha in heads:
              if "suite" in legs:
                  jobs += [{"leg": "suite", "name": name, "sha": sha, "shard": k} for k in range(1, n + 1)]
              for leg in ("cb", "vf", "cdiff", "extra", "scale"):
                  if leg in legs:
                      jobs.append({"leg": leg, "name": name, "sha": sha, "shard": 0})
              jobs += [dict(j, name=name, sha=sha) for j in rs]
          builds = []
          if any(leg in legs for leg in ("cb", "vf", "cdiff", "scale", "rubyspec")):
              builds.append({"name": "base", "sha": base, "dir": "base"})
          builds += [{"name": name, "sha": sha, "dir": "head"} for name, sha in heads]
          print("matrix=" + json.dumps({"include": jobs}))
          print("builds=" + json.dumps({"include": builds}))
          print("label=" + os.environ.get("LABEL", "verify"))
          print(f"shards={n}")
          EOF

  # One job per sha: clone, `make deps`, `make all`, and the tree as an
  # artifact. A spinel binary finds lib/ and its runtime beside itself, so
  # the whole tree goes, .git included (the version stamp, `git diff` in the
  # extra leg), and every job unpacks it at the path it was built at:
  # $RUNNER_TEMP/head for a head, $RUNNER_TEMP/base for the base.
  build:
    needs: plan
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      DIR: ${{ matrix.dir }}
      # sccache as upstream CI has it: its own disk store, restored and saved
      # as one actions/cache entry, and a server started once. sccache is on
      # PATH, so common.mk wraps CC with it.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.10
      # The key never matches (it carries the run id), so the post step always
      # saves; the restore key picks up the newest earlier store of the lane.
      - name: Restore the sccache store
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-verify-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          restore-keys: sccache-verify-build-
      - run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Clone
        id: clone
        run: |
          d="$RUNNER_TEMP/$DIR"
          git clone -q --filter=blob:none https://github.com/matz/spinel.git "$d"
          cd "$d"
          git remote add fork https://github.com/FrancescoK/spinel.git
          # a short sha cannot be fetched by name: fall back to the fork's ci/ branches
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q origin "$SHA" 2>/dev/null ||
            git fetch -q fork "$SHA" 2>/dev/null || git fetch -q fork '+refs/heads/ci/*:refs/remotes/fork/ci/*'
          git checkout -q "$SHA"
          # the vendored parsers are what the versions and the deps recipe make
          v=$({ grep -E '^(PRISM|RBS)_VERSION' Makefile; sed -n '/^deps:/,/^DIST_RELEASE/p' Makefile; } | sha256sum | cut -c1-16)
          echo "vendor=$v" >> "$GITHUB_OUTPUT"
      # `make deps` fetches prism and rbs from rubygems.org; with vendor/
      # restored it has nothing to fetch.
      - name: Restore the vendored parsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/${{ matrix.dir }}/vendor
          key: vendor-${{ steps.clone.outputs.vendor }}
      - name: Build
        run: |
          set -a; . ./verify.conf; set +a
          cd "$RUNNER_TEMP/$DIR"
          make deps > /dev/null || { sleep 30; make deps > /dev/null; }
          make -j"$(nproc)" all > /dev/null
          # the scale leg's counting compiler, for the head and the base
          case " $LEGS " in *" scale "*) make -j"$(nproc)" build/spinel-work > /dev/null 2>&1 || true ;; esac
      - name: Pack
        run: tar -C "$RUNNER_TEMP" -cf - "$DIR" | zstd -q -T0 -3 -o tree.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.name }}
          path: tree.tar.zst
          compression-level: 0
          retention-days: 1
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  run:
    needs: [plan, build]
    # a head whose build failed fails its own jobs, not the others'
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.leg }} ${{ matrix.name }}${{ matrix.shard > 0 && format(' {0}', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once. A run keeps 8 of them free, so a
      # big batch does not hold every other run's report behind it.
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LEG: ${{ matrix.leg }}
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      SHARD: ${{ matrix.shard }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      # sccache for the suite's per-test compiles, one store per slice
      - uses: mozilla-actions/sccache-action@v0.0.10
        if: matrix.leg == 'suite'
      - name: Restore the sccache store
        if: matrix.leg == 'suite'
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-verify-suite-${{ needs.plan.outputs.shards }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-verify-suite-${{ needs.plan.outputs.shards }}-${{ matrix.shard }}-
      - if: matrix.leg == 'suite'
        run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      # A base result is the base sha's, under this runner's ruby, cc and
      # image, made by this branch's files (the base's own tools come with
      # its sha); the tree's path is in the emitted C of a program whose
      # required file's path it names.
      - name: Base cache key
        id: key
        if: matrix.name == 'base' || matrix.leg == 'cdiff'
        run: |
          set -a; . ./verify.conf; set +a
          env_id=$({ ruby -v; cc --version | head -1; nproc; echo "$ImageOS $ImageVersion $RUNNER_TEMP"
                     sha256sum .github/workflows/verify.yml cdiff1.sh cbase1.sh cbase.py; } | sha256sum | cut -c1-16)
          echo "key=verify-base-$LEG-$SHARD-$BASE-$env_id" >> "$GITHUB_OUTPUT"
      - name: Restore the base result
        id: based
        if: matrix.name == 'base'
        uses: actions/cache/restore@v6
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
      - name: Restore the base's C
        id: cbase
        if: matrix.leg == 'cdiff'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/cbase
          key: ${{ steps.key.outputs.key }}
      - uses: actions/download-artifact@v8
        if: matrix.name != 'base'
        with:
          name: tree-${{ matrix.name }}
          path: ${{ runner.temp }}/dl-head
      - uses: actions/download-artifact@v8
        if: matrix.leg == 'cdiff' || matrix.leg == 'scale' || (matrix.name == 'base' && steps.based.outputs.cache-hit != 'true')
        with:
          name: tree-base
          path: ${{ runner.temp }}/dl-base
      - name: Unpack
        run: |
          for r in head base; do
            f="$RUNNER_TEMP/dl-$r/tree.tar.zst"
            if [ -f "$f" ]; then zstd -q -dc "$f" | tar -C "$RUNNER_TEMP" -xf -; rm -f "$f"; fi
          done
        shell: bash
      - name: Run
        id: run
        env:
          BASE_HIT: ${{ steps.based.outputs.cache-hit }}
          CBASE_HIT: ${{ steps.cbase.outputs.cache-hit }}
          BASE_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -a; . ./verify.conf; set +a
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"
          h="$RUNNER_TEMP/head"; [ "$NAME" = base ] && h="$RUNNER_TEMP/base"
          if [ "$BASE_HIT" = true ]; then
            # rev.txt and the result come from the run that computed them
            echo "$BASE_KEY" > "$out/cache.txt"
            exit 0
          fi
          echo "$LEG $NAME $SHARD $(git -C "$h" log -1 --format='%h %s')" > "$out/rev.txt"
          [ "$NAME" = base ] && echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }}, $(date -u '+%Y-%m-%d %H:%M UTC')" > "$out/computed.txt"
          cd "$h"
          case "$LEG" in
          suite)
            tgt="test-corpus"; [ "$SHARD" = 1 ] && tgt="test"
            make -j"$(nproc)" "$tgt" TEST_SHARD="$SHARD/$SHARDS" OPT=-O1 CC=gcc > "$out/test.log" 2>&1 || true
            if [ "$SHARD" = 1 ]; then make infer-test > "$out/infer.log" 2>&1 || true; fi
            printf '%s\n' test/*.rb | wc -l > "$out/corpus.txt"
            ;;
          cb|vf)
            tool=tools/call_binding_probe.rb; [ "$LEG" = vf ] && tool=tools/value_flow_probe.rb
            ruby $tool --strength 2 --seed 1 --jobs "$(nproc)" --no-reduce --out "$out/probe" > "$out/probe.log" 2>&1 || true
            # a timeout depends on the machine's load: such a result is not kept
            if [ "$NAME" = base ] && grep -q -E '^[0-9]+ cases: ' "$out/probe/summary.txt" 2>/dev/null &&
               ! grep -q -E '^ +timeout ' "$out/probe/summary.txt"; then echo save=true >> "$GITHUB_OUTPUT"; fi
            ;;
          cdiff)
            # The base compiles what the head's tree holds, at the head's path,
            # as before; a program's base C comes from the cache where
            # cbase.py finds it still stands.
            b="$RUNNER_TEMP/base"; C="$RUNNER_TEMP/cbase"
            ls test/*.rb test/infer/*.rb benchmark/*.rb > "$out/programs.txt"
            mkdir -p "$out/diffs" "$C/c"
            python3 "$GITHUB_WORKSPACE/cbase.py" plan "$h" "$out/programs.txt" "$C" "$RUNNER_TEMP/recompute.txt" > "$out/cbase.txt"
            xargs -P "$(nproc)" -n 1 "$GITHUB_WORKSPACE/cbase1.sh" "$b/spinel" "$C" < "$RUNNER_TEMP/recompute.txt" || true
            xargs -P "$(nproc)" -n 1 "$GITHUB_WORKSPACE/cdiff1.sh" "$C" "$h/spinel" "$out" < "$out/programs.txt" || true
            touch "$out/changed.txt"; sort -o "$out/changed.txt" "$out/changed.txt"
            if [ "$CBASE_HIT" = true ]; then
              echo "  (cache $BASE_KEY)" >> "$out/cbase.txt"
            else
              # kept only from a head whose test/ and benchmark/ differ from
              # the base's in programs and .expected files alone, so the
              # cache's tree is the base's but for a few programs
              aux=$(git diff --name-only "$BASE" HEAD -- test benchmark |
                    grep -v -E '^(test|test/infer|benchmark)/[^/]+\.rb$|\.expected$' || true)
              miss=$(while read -r p; do [ -f "$C/c/$p.c" ] || echo "$p"; done < "$out/programs.txt" | wc -l)
              if [ -z "$aux" ] && [ "$miss" -eq 0 ]; then
                python3 "$GITHUB_WORKSPACE/cbase.py" manifest "$h" "$C"
                echo save=true >> "$GITHUB_OUTPUT"
                echo "  (computed, cached as $BASE_KEY)" >> "$out/cbase.txt"
              else
                echo "  (computed, not cached: $miss programs without C; other files differ from the base: $(echo "$aux" | tr '\n' ' ' | cut -c1-200))" >> "$out/cbase.txt"
              fi
            fi
            ;;
          rubyspec)
            # `make gate`'s rubyspec leg, which `make test` does not run, in
            # three shards of the tree's own RUBYSPEC_SUITES, balanced by
            # expected-PASS examples (792 | 834 | 830 on master); a suite
            # the list below does not name goes to shard 3, so the shards
            # together run what the tree's gate runs. The base's shards are
            # jobs of their own. spinel builds each example at its default
            # optimization level, as the gate does.
            tag="head"; [ "$NAME" = base ] && tag="base"
            log="$out/rubyspec-$tag.log"
            case "$SHARD" in
            1) mine="language" ;;
            2) mine="core/string core/integer" ;;
            *) mine="core/array core/hash core/range" ;;
            esac
            named=" language core/string core/integer core/array core/hash core/range "
            all=$(sed -n 's/^RUBYSPEC_SUITES *:*= *//p' Makefile)
            suites=""
            for s in $all; do
              case " $mine " in *" $s "*) suites="$suites $s"; continue ;; esac
              case "$named" in *" $s "*) ;; *) [ "$SHARD" = 3 ] && suites="$suites $s" ;; esac
            done
            suites=${suites# }
            if [ -z "$all" ]; then
              # no list to shard: shard 1 runs the whole gate
              if [ "$SHARD" = 1 ]; then RUBYSPEC_JOBS=$(nproc) make rubyspec-gate > "$log" 2>&1 || true
              else echo "rubyspec-gate: RUBYSPEC_SUITES not found in the Makefile; shard 1 ran every suite" > "$log"; fi
            elif [ -z "$suites" ]; then
              echo "rubyspec-gate: no suite of this tree's RUBYSPEC_SUITES ($all) is in shard $SHARD" > "$log"
            else
              # run.sh reads RUBYSPEC_JOBS from the environment (default nproc-2)
              RUBYSPEC_JOBS=$(nproc) make rubyspec-gate RUBYSPEC_SUITES="$suites" > "$log" 2>&1 || true
            fi
            # every suite of the shard ran and answered; a failed extraction
            # or run is not kept
            want=$(echo "$suites" | wc -w)
            if [ "$NAME" = base ] && [ -n "$all" ] && [ "$want" -gt 0 ] &&
               [ "$(grep -c '^rubyspec-gate\[' "$log")" -eq "$want" ] &&
               ! grep -q -E '^rubyspec-gate\[[^]]*\]: (extraction failed|run\.sh failed|ran [0-9]+ of)' "$log"; then
              echo save=true >> "$GITHUB_OUTPUT"
            fi
            ;;
          scale)
            make -j"$(nproc)" build/spinel-work > /dev/null 2>&1 || true
            make scale-test > "$out/scale.log" 2>&1 || true
            # spin's own end-to-end check, which matz runs (#6179)
            { make spin-check > "$out/spin.log" 2>&1 && echo "spin-check: pass" || echo "spin-check: FAIL (rc $?)"; } > "$out/spin.txt"
            b="$RUNNER_TEMP/base"
            if [ -d "$b" ]; then (cd "$b" && make -j"$(nproc)" build/spinel-work > /dev/null 2>&1; make scale-test > "$out/scale-base.log" 2>&1 || true); fi
            ;;
          extra)
            git diff --name-only --diff-filter=A "$BASE" HEAD -- 'test/*.rb' > "$out/new.txt"
            : > "$out/extra.txt"
            while read -r f; do
              exp="$f.expected"; [ -f "$exp" ] || exp="${f%.rb}.expected"
              [ -f "$exp" ] || { echo "$f: no expected file" >> "$out/extra.txt"; continue; }
              for mode in plain promote gcstress; do
                flags=""; envs=""
                [ $mode = promote ] && flags="--int-overflow=promote"
                [ $mode = gcstress ] && envs="SPINEL_GC_STRESS=1"
                if ./spinel $flags "$f" -o "$RUNNER_TEMP/x" > "$out/build.log" 2>&1 &&
                   env $envs timeout 300 "$RUNNER_TEMP/x" > "$RUNNER_TEMP/x.out" 2>&1 &&
                   cmp -s "$RUNNER_TEMP/x.out" "$exp"; then r=pass; else r=FAIL; fi
                echo "$f $mode $r" >> "$out/extra.txt"
              done
            done < "$out/new.txt"
            ;;
          esac
        shell: bash
      - name: Save the base result
        if: matrix.name == 'base' && steps.run.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
      - name: Save the base's C
        if: matrix.leg == 'cdiff' && steps.run.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/cbase
          key: ${{ steps.key.outputs.key }}
      - name: sccache stats
        if: always() && matrix.leg == 'suite'
        run: mkdir -p out && sccache --show-stats | tee out/sccache.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-${{ matrix.leg }}-${{ matrix.name }}-${{ matrix.shard }}
          path: out/
          retention-days: 14

  report:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: res
          pattern: r-*
      - name: Report
        run: |
          python3 report.py res > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
      - uses: actions/upload-artifact@v7
        with:
          name: report-${{ needs.plan.outputs.label }}
          path: |
            report.md
            res/
          retention-days: 30
