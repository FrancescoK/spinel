name: verify
# The per-branch checks of a fix, off the local machine: the suite in
# slices, infer-test, the probes, the corpus C diff against BASE with the
# cost tools over the programs it changes (repr_diff, c_costs, alloc_diff),
# and a new test under --int-overflow=promote and SPINEL_GC_STRESS=1. Edit
# verify.conf and push this branch, or dispatch by hand.
#
# The probes, each on the base and every head: cb, vf and nn (call binding,
# value flow, nil narrowing) in one job each; brow (builtin rows) in shards
# of its ops; sh (String sharing, every case with and without
# --share-strings) in shards of its rows; dc, lit, op and ord (dead code,
# literals, operand order, inference order) in shards of the corpus. A
# probe watch on master is all nine: LEGS="cb vf nn brow sh dc lit op ord".
#
# cident is `make cident` (matz/spinel#7721): the head's own tools/cident.sh
# against BASE, plain and with CIDENT_FLAGS=--share-strings; its cident.txt
# opens with the two lines a restructuring PR pastes (cident-leg.sh).
#
# Each sha is built once, by the build job, and the legs unpack its tree.
# Every make-driven compile goes through sccache, as upstream CI's do: the
# build and each suite slice carry sccache's disk store between runs as one
# actions/cache entry per lane. The base's results (the probes, the rubyspec
# gate, the C the base emits for each corpus program) are cached by the base
# sha, the leg, the runner (image, ruby, cc) and the files of this branch that
# make them; the report says which came from the cache.
#
# pgate is the gate leg's verdict and lines from parallel jobs on one merged
# tree (pgate.py says what runs where): a prep job merges master once, builds
# and packs the tree; legs, PGATE_CORPUS_SHARDS corpus slices and
# PGATE_RUBYSPEC_SHARDS ruby/spec groups run on it (10 jobs by default); a
# finish job adds them up into the gate leg's files and runs gate.rb stamp.
# The gate's own result cache (tools/result_cache.sh, GATE_CACHE=1 as
# `make gate` runs) is carried between pgate runs: its entries are keyed by
# the generated C and every input of the build and run, and hold passes only.
on:
  push:
    branches: [verify]
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      builds: ${{ steps.m.outputs.builds }}
      gates: ${{ steps.m.outputs.gates }}
      has_gate: ${{ steps.m.outputs.has_gate }}
      has_run: ${{ steps.m.outputs.has_run }}
      has_build: ${{ steps.m.outputs.has_build }}
      label: ${{ steps.m.outputs.label }}
      shards: ${{ steps.m.outputs.shards }}
      pgates: ${{ steps.m.outputs.pgates }}
      pgate_parts: ${{ steps.m.outputs.pgate_parts }}
      pgate_expect: ${{ steps.m.outputs.pgate_expect }}
      has_pgate: ${{ steps.m.outputs.has_pgate }}
      pgate_cache: ${{ steps.m.outputs.pgate_cache }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          set -a; . ./verify.conf; set +a
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          heads = [h.split("=", 1) for h in os.environ["HEADS"].split()]
          legs = os.environ["LEGS"].split()
          n = int(os.environ.get("SHARDS", "4"))
          base = os.environ["BASE"]
          # "base" names the base's tree and its jobs
          assert all(name != "base" for name, _ in heads), "a head may not be called base"
          # the rubyspec gate in shards of suites (the Run step's case)
          rs = [{"leg": "rubyspec", "shard": k} for k in (1, 2, 3, 4, 5)] if "rubyspec" in legs else []
          # the sharded probes (the Run step's case), each on the base and
          # every head: brow the builtin-row probe in --shard slices of its
          # ops; sh the String-sharing probe in --shard slices of its rows;
          # dc, lit, op and ord Matz's corpus probes, each shard every
          # n-th program of the tool's default FILE set. <LEG>_SHARDS in
          # verify.conf overrides a count. The counts aim at an hour or less
          # a shard on a 4-core runner (dc: some 25 builds a program).
          sharded = {"brow": 4, "sh": 2, "dc": 12, "lit": 1, "op": 2, "ord": 1}
          sp = []
          for leg, d in sharded.items():
              if leg in legs:
                  of = int(os.environ.get(leg.upper() + "_SHARDS", d))
                  sp += [{"leg": leg, "shard": k, "of": of} for k in range(1, of + 1)]
          jobs = []
          for leg in ("cb", "vf", "nn"):
              if leg in legs:
                  jobs.append({"leg": leg, "name": "base", "sha": base, "shard": 0})
          jobs += [dict(j, name="base", sha=base) for j in rs + sp]
          for name, sha in heads:
              if "suite" in legs:
                  jobs += [{"leg": "suite", "name": name, "sha": sha, "shard": k} for k in range(1, n + 1)]
              for leg in ("cb", "vf", "nn", "cdiff", "cident", "extra", "scale"):
                  if leg in legs:
                      jobs.append({"leg": leg, "name": name, "sha": sha, "shard": 0})
              jobs += [dict(j, name=name, sha=sha) for j in rs + sp]
          builds = []
          if any(leg in legs for leg in ("cb", "vf", "nn", "cdiff", "scale", "rubyspec", *sharded)):
              builds.append({"name": "base", "sha": base, "dir": "base"})
          if any(leg not in ("gate", "pgate") for leg in legs):
              builds += [{"name": name, "sha": sha, "dir": "head"} for name, sha in heads]
          print("gates=" + json.dumps({"include": [{"name": name, "sha": sha} for name, sha in heads] if "gate" in legs else []}))
          print("has_gate=" + str("gate" in legs).lower())
          # pgate's parts, longest first: the ruby/spec groups (language
          # alone is some 7 minutes), the corpus slices, the other legs
          pg = "pgate" in legs
          nc = int(os.environ.get("PGATE_CORPUS_SHARDS", "8"))
          nr = int(os.environ.get("PGATE_RUBYSPEC_SHARDS", "4"))
          parts = ([("rubyspec", k, nr) for k in range(1, nr + 1)] +
                   [("corpus", k, nc) for k in range(1, nc + 1)] + [("legs", 0, 0)])
          print("pgates=" + json.dumps({"include": [{"name": name, "sha": sha} for name, sha in heads] if pg else []}))
          print("pgate_parts=" + json.dumps({"include": [{"name": name, "sha": sha, "part": p, "k": k, "of": of}
                                                         for name, sha in heads for p, k, of in parts] if pg else []}))
          print("pgate_expect=" + " ".join(f"{p}-{k}" for p, k, _ in parts))
          print("has_pgate=" + str(pg).lower())
          # PGATE_CACHE=0: start from no earlier run's result cache
          print("pgate_cache=" + os.environ.get("PGATE_CACHE", "1"))
          print("has_run=" + str(bool(jobs)).lower())
          print("has_build=" + str(bool(builds)).lower())
          print("matrix=" + json.dumps({"include": jobs}))
          print("builds=" + json.dumps({"include": builds}))
          print("label=" + os.environ.get("LABEL", "verify"))
          print(f"shards={n}")
          EOF

  # One job per sha: clone, `make deps`, `make all`, and the tree as an
  # artifact. A spinel binary finds lib/ and its runtime beside itself, so
  # the whole tree goes, .git included (the version stamp, `git diff` in the
  # extra leg), and every job unpacks it at the path it was built at:
  # $RUNNER_TEMP/head for a head, $RUNNER_TEMP/base for the base.
  build:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      DIR: ${{ matrix.dir }}
      # sccache as upstream CI has it: its own disk store, restored and saved
      # as one actions/cache entry, and a server started once. sccache is on
      # PATH, so common.mk wraps CC with it.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.10
      # The key never matches (it carries the run id), so the post step always
      # saves; the restore key picks up the newest earlier store of the lane.
      - name: Restore the sccache store
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-verify-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          restore-keys: sccache-verify-build-
      - run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Clone
        id: clone
        run: |
          d="$RUNNER_TEMP/$DIR"
          git clone -q --filter=blob:none https://github.com/matz/spinel.git "$d"
          cd "$d"
          git remote add fork https://github.com/FrancescoK/spinel.git
          # a short sha cannot be fetched by name: fall back to the fork's ci/ branches
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q origin "$SHA" 2>/dev/null ||
            git fetch -q fork "$SHA" 2>/dev/null || git fetch -q fork '+refs/heads/ci/*:refs/remotes/fork/ci/*'
          git checkout -q "$SHA"
          # the vendored parsers are what the versions and the deps recipe make
          v=$({ grep -E '^(PRISM|RBS)_VERSION' Makefile; sed -n '/^deps:/,/^DIST_RELEASE/p' Makefile; } | sha256sum | cut -c1-16)
          echo "vendor=$v" >> "$GITHUB_OUTPUT"
      # `make deps` fetches prism and rbs from rubygems.org; with vendor/
      # restored it has nothing to fetch.
      - name: Restore the vendored parsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/${{ matrix.dir }}/vendor
          key: vendor-${{ steps.clone.outputs.vendor }}
      - name: Build
        run: |
          set -a; . ./verify.conf; set +a
          cd "$RUNNER_TEMP/$DIR"
          make deps > /dev/null || { sleep 30; make deps > /dev/null; }
          make -j"$(nproc)" all > /dev/null
          # the scale leg's counting compiler, for the head and the base
          case " $LEGS " in *" scale "*) make -j"$(nproc)" build/spinel-work > /dev/null 2>&1 || true ;; esac
      - name: Pack
        run: tar -C "$RUNNER_TEMP" -cf - "$DIR" | zstd -q -T0 -3 -o tree.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.name }}
          path: tree.tar.zst
          compression-level: 0
          retention-days: 1
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  run:
    needs: [plan, build]
    # a head whose build failed fails its own jobs, not the others'
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_run == 'true' }}
    runs-on: ubuntu-latest
    # a corpus or builtin-row shard is given longer: its time is a guess;
    # cident compiles the corpus four times and builds the base twice
    timeout-minutes: ${{ contains(fromJSON('["brow", "sh", "dc", "lit", "op", "ord", "cident"]'), matrix.leg) && 240 || 120 }}
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once. A run keeps 8 of them free, so a
      # big batch does not hold every other run's report behind it.
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LEG: ${{ matrix.leg }}
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      SHARD: ${{ matrix.shard }}
      # a sharded probe's count of shards (the plan's `sharded`)
      OF: ${{ matrix.of }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      # sccache for the suite's per-test compiles, one store per slice
      - name: Set up sccache (suite legs only)
        uses: mozilla-actions/sccache-action@v0.0.10
        if: matrix.leg == 'suite'
      - name: Restore the sccache store (suite legs only)
        if: matrix.leg == 'suite'
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-verify-suite-${{ needs.plan.outputs.shards }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-verify-suite-${{ needs.plan.outputs.shards }}-${{ matrix.shard }}-
      - name: Start sccache (suite legs only)
        if: matrix.leg == 'suite'
        run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      # A base result is the base sha's, under this runner's ruby, cc and
      # image, made by this branch's files (the base's own tools come with
      # its sha); the tree's path is in the emitted C of a program whose
      # required file's path it names. A head's probe result is kept the
      # same way under the head's sha, so a later run whose BASE is that
      # sha, spelled alike (a probe watch's last head), takes it as its base.
      - name: Base cache key
        id: key
        if: matrix.name == 'base' || contains(fromJSON('["cdiff", "cb", "vf", "nn", "brow", "sh", "dc", "lit", "op", "ord"]'), matrix.leg)
        run: |
          set -a; . ./verify.conf; set +a
          # sh: the copy of the probe a tree without one runs (shareprobe/)
          mine=""; [ "$LEG" = sh ] && mine=$(ls shareprobe/*)
          env_id=$({ ruby -v; cc --version | head -1; nproc; echo "$ImageOS $ImageVersion $RUNNER_TEMP"
                     sha256sum .github/workflows/verify.yml cdiff1.sh cbase1.sh cbase.py $mine; } | sha256sum | cut -c1-16)
          of=$BASE; [ "$NAME" != base ] && [ "$LEG" != cdiff ] && of=$SHA
          # a head run with PROBE_ENV on the base's own sha must not share the base's key
          pe=""; [ "$NAME" != base ] && [ -n "${PROBE_ENV:-}" ] && pe="-pe$(printf %s "$PROBE_ENV" | sha256sum | cut -c1-8)"
          echo "key=verify-base-$LEG-$SHARD${OF:+of$OF}-$of$pe-$env_id" >> "$GITHUB_OUTPUT"
      - name: Restore the base result (base side of a probe or rubyspec only)
        id: based
        if: matrix.name == 'base'
        uses: actions/cache/restore@v6
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
      - name: Restore the base's C (cdiff only)
        id: cbase
        if: matrix.leg == 'cdiff'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/cbase
          key: ${{ steps.key.outputs.key }}
      - name: Download the head's build (head legs only)
        uses: actions/download-artifact@v8
        if: matrix.name != 'base'
        with:
          name: tree-${{ matrix.name }}
          path: ${{ runner.temp }}/dl-head
      - name: Download the base's build (cdiff, scale, or a base result not cached)
        uses: actions/download-artifact@v8
        if: matrix.leg == 'cdiff' || matrix.leg == 'scale' || (matrix.name == 'base' && steps.based.outputs.cache-hit != 'true')
        with:
          name: tree-base
          path: ${{ runner.temp }}/dl-base
      - name: Unpack
        run: |
          for r in head base; do
            f="$RUNNER_TEMP/dl-$r/tree.tar.zst"
            if [ -f "$f" ]; then zstd -q -dc "$f" | tar -C "$RUNNER_TEMP" -xf -; rm -f "$f"; fi
          done
        shell: bash
      - name: Run
        id: run
        env:
          BASE_HIT: ${{ steps.based.outputs.cache-hit }}
          CBASE_HIT: ${{ steps.cbase.outputs.cache-hit }}
          BASE_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -a; . ./verify.conf; set +a
          # PROBE_ENV: NAME=value pairs for the legs' own runs only, not the build (a flag such as
          # SPINEL_SHARE_STRINGS=1 must not reach the tools the build compiles with spinel)
          # the head side only: base is the comparison WITHOUT the flag (PROBESHARE2 exported it in both)
          [ -n "${PROBE_ENV:-}" ] && [ "$NAME" != base ] && export ${PROBE_ENV}
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"
          h="$RUNNER_TEMP/head"; [ "$NAME" = base ] && h="$RUNNER_TEMP/base"
          if [ "$BASE_HIT" = true ]; then
            # rev.txt and the result come from the run that computed them
            echo "$BASE_KEY" > "$out/cache.txt"
            exit 0
          fi
          echo "$LEG $NAME $SHARD $(git -C "$h" log -1 --format='%h %s')" > "$out/rev.txt"
          echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }}, $(date -u '+%Y-%m-%d %H:%M UTC')" > "$out/computed.txt"
          cd "$h"
          # optcarrot, packed as `make optcarrot` packs it, so the corpus legs
          # compare it too
          pack_optcarrot() {
            repo=$(sed -n 's/^OPTCARROT_REPO *:*= *//p' Makefile); br=$(sed -n 's/^OPTCARROT_BRANCH *:*= *//p' Makefile)
            if [ -n "$repo" ] && git clone -q --depth=1 ${br:+--branch=$br} "$repo" build/optcarrot 2>/dev/null; then
              ruby build/optcarrot/tools/pack-for-spinel.rb > build/optcarrot-single.rb || rm -f build/optcarrot-single.rb
            fi
          }
          case "$LEG" in
          suite)
            tgt="test-corpus"; [ "$SHARD" = 1 ] && tgt="test"
            make -j"$(nproc)" "$tgt" TEST_SHARD="$SHARD/$SHARDS" OPT=-O1 CC=gcc > "$out/test.log" 2>&1 || true
            if [ "$SHARD" = 1 ]; then make infer-test > "$out/infer.log" 2>&1 || true; fi
            printf '%s\n' test/*.rb | wc -l > "$out/corpus.txt"
            ;;
          cb|vf|nn|brow)
            tool=tools/call_binding_probe.rb; more=""; [ "$LEG" = vf ] && tool=tools/value_flow_probe.rb
            # nn: the nil-narrowing probe, with each tree's own generator
            [ "$LEG" = nn ] && tool=tools/nil_narrowing_probe.rb
            # brow: the builtin-row probe, the SHARD-th of OF slices of its ops
            # (--shard counts from 0)
            [ "$LEG" = brow ] && tool=tools/builtin_row_probe.rb more="--shard $((SHARD - 1))/$OF"
            ruby $tool --strength 2 --seed 1 $more --jobs "$(nproc)" --no-reduce --out "$out/probe" > "$out/probe.log" 2>&1 || true
            # a timeout depends on the machine's load: such a result is not kept
            if grep -q -E '^[0-9]+ cases: ' "$out/probe/summary.txt" 2>/dev/null &&
               ! grep -q -E '^ +timeout ' "$out/probe/summary.txt"; then echo save=true >> "$GITHUB_OUTPUT"; fi
            ;;
          sh)
            # The String-sharing probe (tools/share_probe.rb), the SHARD-th
            # of OF slices of its rows (--shard counts from 0), under the case
            # numbers of the whole run. Each case is compiled with and without
            # --share-strings, by the probe itself: it drops
            # SPINEL_SHARE_STRINGS from its environment (PROBE_ENV's would
            # turn the flag on for the plain cases too), and its summary
            # counts each label per mode. A tree without the tool runs this
            # branch's copy (shareprobe/, as of share-probe 307e4125f)
            # against its own spinel.
            tool=tools/share_probe.rb; [ -f "$tool" ] || tool="$GITHUB_WORKSPACE/shareprobe/share_probe.rb"
            SPINEL="$h/spinel" ruby "$tool" --strength 2 --seed 1 --shard "$((SHARD - 1))/$OF" --jobs "$(nproc)" \
              --no-reduce --out "$out/probe" > "$out/probe.log" 2>&1 || true
            if grep -q -E '^[0-9]+ cases: ' "$out/probe/summary.txt" 2>/dev/null &&
               ! grep -q -E '^ +timeout ' "$out/probe/summary.txt"; then echo save=true >> "$GITHUB_OUTPUT"; fi
            ;;
          dc|lit|op|ord)
            # Matz's corpus probes: dead code, literals, operand order and
            # inference order. Each shard takes every OF-th program of the
            # tool's default FILE set, from the SHARD-th on, the promote_
            # tests left out as each tool's default leaves them; lit without
            # its reduction. A summary and the timeouts in each tool's words.
            case "$LEG" in
            dc) tool=tools/dead_code_probe.rb; set -- test/*.rb
                done_re='^findings: [0-9]+ in '; late_re='^ +timeout +[0-9]|spinel ran past|no answer after' ;;
            lit) tool=tools/literal_probe.rb; set -- test/*.rb
                 done_re='^findings: [0-9]+ programs, '; late_re='does not compile in time|does not end' ;;
            op) tool=tools/operand_probe.rb; set -- test/*.rb
                done_re='^findings: [0-9]+ programs, '; late_re='out of time' ;;
            ord) tool=tools/order_probe.rb; set -- test/*.rb test/infer/*.rb benchmark/*.rb
                 done_re='^findings: [0-9]+ programs, '; late_re='timeout( in both orders|: )' ;;
            esac
            for f in "$@"; do if [ -f "$f" ]; then echo "$f"; fi; done | grep -v '/promote_[^/]*$' | LC_ALL=C sort |
              awk -v n="$OF" -v k="$SHARD" 'NR % n == k % n' > "$out/files.txt"
            more=""; [ "$LEG" = lit ] && more="--no-reduce"
            ruby "$tool" --jobs "$(nproc)" $more --out "$out/probe" $(cat "$out/files.txt") > "$out/probe.log" 2>&1 || true
            if grep -q -E "$done_re" "$out/probe/summary.txt" 2>/dev/null &&
               ! grep -q -E "$late_re" "$out/probe/summary.txt"; then echo save=true >> "$GITHUB_OUTPUT"; fi
            ;;
          cdiff)
            # The base compiles what the head's tree holds, at the head's path,
            # as before; a program's base C comes from the cache where
            # cbase.py finds it still stands.
            b="$RUNNER_TEMP/base"; C="$RUNNER_TEMP/cbase"
            # optcarrot and the packages' tests too, so a PR's "optcarrot and
            # the packages emit the same C" is what this leg checked
            pack_optcarrot
            ls test/*.rb test/infer/*.rb benchmark/*.rb packages/*/test/*.rb build/optcarrot-single.rb 2>/dev/null > "$out/programs.txt"
            mkdir -p "$out/diffs" "$C/c"
            python3 "$GITHUB_WORKSPACE/cbase.py" plan "$h" "$out/programs.txt" "$C" "$RUNNER_TEMP/recompute.txt" > "$out/cbase.txt"
            xargs -P "$(nproc)" -n 1 "$GITHUB_WORKSPACE/cbase1.sh" "$b/spinel" "$C" < "$RUNNER_TEMP/recompute.txt" || true
            xargs -P "$(nproc)" -n 1 "$GITHUB_WORKSPACE/cdiff1.sh" "$C" "$h/spinel" "$out" < "$out/programs.txt" || true
            touch "$out/changed.txt"; sort -o "$out/changed.txt" "$out/changed.txt"
            # The cost tools (#7501) over the programs whose C changed: which
            # slots changed representation, which costly constructs the C
            # gained or lost (in loops and out), and what the two builds
            # allocate when run. The head's own copies when it has them,
            # else this branch's: costguard/ holds tools/repr_diff.sh,
            # c_costs.sh and alloc_diff.sh as of cost-guard ace7e8925, until
            # matz/spinel has them. A report, never a failure.
            ct="$h/tools"; [ -f "$ct/c_costs.sh" ] || ct="$GITHUB_WORKSPACE/costguard"
            if [ -s "$out/changed.txt" ]; then
              REPR_DIFF_JOBS=$(nproc) bash "$ct/repr_diff.sh" "$b/spinel" "$h/spinel" $(cat "$out/changed.txt") > "$out/repr_diff.txt" 2>&1 || true
              C_COSTS_JOBS=$(nproc) bash "$ct/c_costs.sh" "$b/spinel" "$h/spinel" $(cat "$out/changed.txt") > "$out/c_costs.txt" 2>&1 || true
              # each program is built and run on both sides: the first
              # ALLOC_MAX changed programs, and the report says when cut
              amax=${ALLOC_MAX:-400}; n=$(wc -l < "$out/changed.txt")
              ALLOC_DIFF_JOBS=$(nproc) bash "$ct/alloc_diff.sh" "$b/spinel" "$h/spinel" $(head -n "$amax" "$out/changed.txt") > "$out/alloc_diff.txt" 2>&1 || true
              if [ "$n" -gt "$amax" ]; then echo "  (the first $amax of $n changed programs)" >> "$out/alloc_diff.txt"; fi
            fi
            if [ "$CBASE_HIT" = true ]; then
              echo "  (cache $BASE_KEY)" >> "$out/cbase.txt"
            else
              # kept only from a head whose test/ and benchmark/ differ from
              # the base's in programs and .expected files alone, so the
              # cache's tree is the base's but for a few programs
              aux=$(git diff --name-only "$BASE" HEAD -- test benchmark |
                    grep -v -E '^(test|test/infer|benchmark)/[^/]+\.rb$|\.expected$' || true)
              miss=$(while read -r p; do [ -f "$C/c/$p.c" ] || echo "$p"; done < "$out/programs.txt" | wc -l)
              if [ -z "$aux" ] && [ "$miss" -eq 0 ]; then
                python3 "$GITHUB_WORKSPACE/cbase.py" manifest "$h" "$C"
                echo save=true >> "$GITHUB_OUTPUT"
                echo "  (computed, cached as $BASE_KEY)" >> "$out/cbase.txt"
              else
                echo "  (computed, not cached: $miss programs without C; other files differ from the base: $(echo "$aux" | tr '\n' ' ' | cut -c1-200))" >> "$out/cbase.txt"
              fi
            fi
            ;;
          cident)
            # `make cident` (matz/spinel#7721) with the head's own tool, plain
            # and --share-strings, against BASE, the base cdiff compares with.
            # cident.sh builds BASE itself in a worktree of this clone (a
            # full-history blobless clone: the base's blobs are fetched on
            # checkout); a head without the tool says so and writes no result.
            [ -f tools/cident.sh ] && pack_optcarrot
            CIDENT_JOBS=$(nproc) "$GITHUB_WORKSPACE/cident-leg.sh" "$h" "$out" "$BASE"
            ;;
          rubyspec)
            # `make gate`'s rubyspec leg, which `make test` does not run, in
            # five shards of the tree's own RUBYSPEC_SUITES, balanced by
            # expected-PASS examples (792 | 834 | 830 | 506 | 707 with the
            # core waves); a suite
            # the list below does not name goes to shard 3, so the shards
            # together run what the tree's gate runs. The base's shards are
            # jobs of their own. spinel builds each example at its default
            # optimization level, as the gate does.
            tag="head"; [ "$NAME" = base ] && tag="base"
            log="$out/rubyspec-$tag.log"
            case "$SHARD" in
            1) mine="language" ;;
            2) mine="core/string core/integer" ;;
            4) mine="core/set core/matchdata core/time core/math" ;;
            5) mine="core/symbol core/float core/proc core/rational core/regexp core/exception core/complex core/struct core/random core/nil core/true core/false" ;;
            *) mine="core/array core/hash core/range" ;;
            esac
            named=" language core/string core/integer core/array core/hash core/range core/set core/matchdata core/time core/math core/symbol core/float core/proc core/rational core/regexp core/exception core/complex core/struct core/random core/nil core/true core/false "
            all=$(sed -n 's/^RUBYSPEC_SUITES *:*= *//p' Makefile)
            suites=""
            for s in $all; do
              case " $mine " in *" $s "*) suites="$suites $s"; continue ;; esac
              case "$named" in *" $s "*) ;; *) [ "$SHARD" = 3 ] && suites="$suites $s" ;; esac
            done
            suites=${suites# }
            if [ -z "$all" ]; then
              # no list to shard: shard 1 runs the whole gate
              if [ "$SHARD" = 1 ]; then RUBYSPEC_JOBS=$(nproc) make rubyspec-gate > "$log" 2>&1 || true
              else echo "rubyspec-gate: RUBYSPEC_SUITES not found in the Makefile; shard 1 ran every suite" > "$log"; fi
            elif [ -z "$suites" ]; then
              echo "rubyspec-gate: no suite of this tree's RUBYSPEC_SUITES ($all) is in shard $SHARD" > "$log"
            else
              # run.sh reads RUBYSPEC_JOBS from the environment (default nproc-2)
              RUBYSPEC_JOBS=$(nproc) make rubyspec-gate RUBYSPEC_SUITES="$suites" > "$log" 2>&1 || true
            fi
            # every suite of the shard ran and answered; a failed extraction
            # or run is not kept
            want=$(echo "$suites" | wc -w)
            if [ "$NAME" = base ] && [ -n "$all" ] && [ "$want" -gt 0 ] &&
               [ "$(grep -c '^rubyspec-gate\[' "$log")" -eq "$want" ] &&
               ! grep -q -E '^rubyspec-gate\[[^]]*\]: (extraction failed|run\.sh failed|ran [0-9]+ of)' "$log"; then
              echo save=true >> "$GITHUB_OUTPUT"
            fi
            ;;
          scale)
            make -j"$(nproc)" build/spinel-work > /dev/null 2>&1 || true
            make scale-test > "$out/scale.log" 2>&1 || true
            # spin's own end-to-end check, which matz runs (#6179)
            { make spin-check > "$out/spin.log" 2>&1 && echo "spin-check: pass" || echo "spin-check: FAIL (rc $?)"; } > "$out/spin.txt"
            b="$RUNNER_TEMP/base"
            if [ -d "$b" ]; then (cd "$b" && make -j"$(nproc)" build/spinel-work > /dev/null 2>&1; make scale-test > "$out/scale-base.log" 2>&1 || true); fi
            ;;
          extra)
            git diff --name-only --diff-filter=A "$BASE" HEAD -- 'test/*.rb' > "$out/new.txt"
            : > "$out/extra.txt"
            while read -r f; do
              exp="$f.expected"; [ -f "$exp" ] || exp="${f%.rb}.expected"
              [ -f "$exp" ] || { echo "$f: no expected file" >> "$out/extra.txt"; continue; }
              for mode in plain promote gcstress; do
                flags=""; envs=""
                [ $mode = promote ] && flags="--int-overflow=promote"
                [ $mode = gcstress ] && envs="SPINEL_GC_STRESS=1"
                if ./spinel $flags "$f" -o "$RUNNER_TEMP/x" > "$out/build.log" 2>&1 &&
                   env $envs timeout 300 "$RUNNER_TEMP/x" > "$RUNNER_TEMP/x.out" 2>&1 &&
                   cmp -s "$RUNNER_TEMP/x.out" "$exp"; then r=pass; else r=FAIL; fi
                echo "$f $mode $r" >> "$out/extra.txt"
              done
            done < "$out/new.txt"
            ;;
          esac
        shell: bash
      # the base's result, or a head's probe result kept for a later base
      - name: Save the base result (probes and rubyspec, when computed this run)
        if: matrix.leg != 'cdiff' && steps.run.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: out
          key: ${{ steps.key.outputs.key }}
      - name: Save the base's C (cdiff, when computed this run)
        if: matrix.leg == 'cdiff' && steps.run.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/cbase
          key: ${{ steps.key.outputs.key }}
      - name: sccache stats (suite legs only)
        if: always() && matrix.leg == 'suite'
        run: mkdir -p out && sccache --show-stats | tee out/sccache.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-${{ matrix.leg }}-${{ matrix.name }}-${{ matrix.shard }}
          path: out/
          retention-days: 14

  gate:
    needs: plan
    if: needs.plan.outputs.has_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.gates) }}
    env:
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Restore the sccache store
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-verify-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          restore-keys: sccache-verify-gate-
      - run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Clone and merge current master
        id: merge
        run: |
          d="$RUNNER_TEMP/gate"
          git clone -q --filter=blob:none https://github.com/matz/spinel.git "$d"
          cd "$d"
          git remote add fork https://github.com/FrancescoK/spinel.git
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q origin "$SHA" 2>/dev/null ||
            git fetch -q fork "$SHA" 2>/dev/null || git fetch -q fork '+refs/heads/ci/*:refs/remotes/fork/ci/*'
          git checkout -q "$SHA"
          "$GITHUB_WORKSPACE/gate-leg.sh" "$d" "$GITHUB_WORKSPACE/out" prepare
          if grep -q '^status=CONFLICT$' "$GITHUB_WORKSPACE/out/gate-meta.txt"; then
            echo conflict=true >> "$GITHUB_OUTPUT"
          else
            v=$({ grep -E '^(PRISM|RBS)_VERSION' Makefile; sed -n '/^deps:/,/^DIST_RELEASE/p' Makefile; } | sha256sum | cut -c1-16)
            echo "vendor=$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the vendored parsers
        if: steps.merge.outputs.conflict != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gate/vendor
          key: vendor-${{ steps.merge.outputs.vendor }}
      - name: Gate
        if: steps.merge.outputs.conflict != 'true'
        run: ./gate-leg.sh "$RUNNER_TEMP/gate" "$GITHUB_WORKSPACE/out" run
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-gate-${{ matrix.name }}-0
          path: out/
          retention-days: 14

  # pgate, 1 of 3: merge current master once, build, pack the tree. The
  # parts unpack it at this path, so every part runs the same tree.
  pgate-prep:
    needs: plan
    if: needs.plan.outputs.has_pgate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.pgates) }}
    env:
      NAME: ${{ matrix.name }}
      SHA: ${{ matrix.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.10
      # `make all` is the build job's work: its store, read only
      - name: Restore the sccache store
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-verify-build-${{ github.run_id }}-pgate-${{ matrix.name }}
          restore-keys: sccache-verify-build-
      - run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Clone and merge current master
        id: merge
        run: |
          d="$RUNNER_TEMP/pgate"
          git clone -q --filter=blob:none https://github.com/matz/spinel.git "$d"
          cd "$d"
          git remote add fork https://github.com/FrancescoK/spinel.git
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q origin "$SHA" 2>/dev/null ||
            git fetch -q fork "$SHA" 2>/dev/null || git fetch -q fork '+refs/heads/ci/*:refs/remotes/fork/ci/*'
          git checkout -q "$SHA"
          "$GITHUB_WORKSPACE/gate-leg.sh" "$d" "$GITHUB_WORKSPACE/prep" prepare
          if grep -q '^status=CONFLICT$' "$GITHUB_WORKSPACE/prep/gate-meta.txt"; then
            echo conflict=true >> "$GITHUB_OUTPUT"
          else
            v=$({ grep -E '^(PRISM|RBS)_VERSION' Makefile; sed -n '/^deps:/,/^DIST_RELEASE/p' Makefile; } | sha256sum | cut -c1-16)
            echo "vendor=$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the vendored parsers
        if: steps.merge.outputs.conflict != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pgate/vendor
          key: vendor-${{ steps.merge.outputs.vendor }}
      - name: Build
        id: build
        if: steps.merge.outputs.conflict != 'true'
        run: |
          ./pgate.sh prep "$RUNNER_TEMP/pgate" "$GITHUB_WORKSPACE/prep"
          cat "$GITHUB_WORKSPACE/prep/pch.txt" >> "$GITHUB_OUTPUT"
      # The corpus PCH under the key of its inputs (pgate.sh prep): the
      # result cache's fingerprint hashes the .gch, which gcc does not
      # write the same twice.
      - name: Restore the corpus PCH
        id: pch
        if: steps.build.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pgate/${{ steps.build.outputs.dir }}
          key: pgate-pch-${{ steps.build.outputs.key }}
      - name: PCH
        if: steps.build.outcome == 'success'
        run: ./pgate.sh pch "$RUNNER_TEMP/pgate" "$GITHUB_WORKSPACE/prep" "${{ steps.pch.outputs.cache-hit }}"
      - name: Save the corpus PCH (when it was not restored)
        if: steps.build.outcome == 'success' && steps.pch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pgate/${{ steps.build.outputs.dir }}
          key: pgate-pch-${{ steps.build.outputs.key }}
      # the newest store of earlier runs' passes; finish saves this run's
      - name: Restore the result cache
        if: steps.build.outcome == 'success' && needs.plan.outputs.pgate_cache != '0'
        uses: actions/cache/restore@v6
        with:
          # the path the finish job saves from: a cache entry's version hashes
          # its path, so a restore to any other path never matches
          path: ${{ runner.temp }}/rc/result-cache
          key: pgate-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          restore-keys: pgate-results-
      - name: Pack
        if: steps.build.outcome == 'success'
        run: |
          grep -q '^status=PREPARED$' prep/gate-meta.txt
          if [ -d "$RUNNER_TEMP/rc/result-cache" ]; then
            mkdir -p "$RUNNER_TEMP/pgate/build" && cp -R "$RUNNER_TEMP/rc/result-cache" "$RUNNER_TEMP/pgate/build/"
          fi
          echo "[pgate] result cache restored: $(find "$RUNNER_TEMP/pgate/build/result-cache" -type f 2>/dev/null | wc -l) entries" >> prep/gate.log
          tar -C "$RUNNER_TEMP" -cf - pgate | zstd -q -T0 -3 -o prep/tree.tar.zst
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pgate-prep-${{ matrix.name }}
          path: prep/
          compression-level: 0
          retention-days: 1
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # pgate, 2 of 3: the parts. max-parallel keeps a run to 10 of the
  # account's 20 jobs (see the run job).
  pgate-part:
    needs: [plan, pgate-prep]
    if: ${{ !cancelled() && needs.plan.outputs.has_pgate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.pgate_parts) }}
    env:
      NAME: ${{ matrix.name }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_STARTUP_TIMEOUT: "30"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
      # the legs part builds build/spinel-work and the C-side legs' helpers;
      # the corpus and ruby/spec parts compile without sccache, so their
      # compile line (in the result cache's key) is the same in every run
      - name: Set up sccache (legs part only)
        uses: mozilla-actions/sccache-action@v0.0.10
        if: matrix.part == 'legs'
      - name: Restore the sccache store (legs part only)
        if: matrix.part == 'legs'
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-verify-build-${{ github.run_id }}-pgate-legs-${{ matrix.name }}
          restore-keys: sccache-verify-build-
      - name: Start sccache (legs part only)
        if: matrix.part == 'legs'
        run: sccache --start-server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pgate-prep-${{ matrix.name }}
          path: ${{ runner.temp }}/prep
      - name: Run
        run: ./pgate.sh part "$RUNNER_TEMP/prep" "$GITHUB_WORKSPACE/out" "${{ matrix.part }}" "${{ matrix.k }}" "${{ matrix.of }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-${{ matrix.part }}-${{ matrix.k }}--${{ matrix.name }}
          path: out/
          retention-days: 3

  # pgate, 3 of 3: the parts added up into the gate leg's files (report.py
  # reads them as a gate), the stamp, and the result cache's new store.
  pgate:
    needs: [plan, pgate-prep, pgate-part]
    if: ${{ !cancelled() && needs.plan.outputs.has_pgate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.pgates) }}
    env:
      NAME: ${{ matrix.name }}
      EXPECT: ${{ needs.plan.outputs.pgate_expect }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pgate-prep-${{ matrix.name }}
          path: ${{ runner.temp }}/prep
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pg-*--${{ matrix.name }}
          path: ${{ runner.temp }}/parts
      - name: Finish
        run: |
          f="$RUNNER_TEMP/prep/tree.tar.zst"
          if [ -f "$f" ]; then zstd -q -dc "$f" | tar -C "$RUNNER_TEMP" -xf -; fi
          # every part's result cache, one store
          mkdir -p "$RUNNER_TEMP/rc/result-cache"
          for t in "$RUNNER_TEMP"/parts/*/result-cache.tar; do [ -f "$t" ] && tar -C "$RUNNER_TEMP/rc" -xf "$t"; done
          echo "entries=$(find "$RUNNER_TEMP/rc/result-cache" -type f | wc -l)" >> "$GITHUB_OUTPUT"
          python3 pgate.py finish --prep "$RUNNER_TEMP/prep" --parts "$RUNNER_TEMP/parts" --out out \
            --name "$NAME" --expect "$EXPECT" --checkout "$RUNNER_TEMP/pgate"
        id: finish
      - name: Save the result cache (when it has entries)
        if: always() && steps.finish.outputs.entries > 0
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/rc/result-cache
          key: pgate-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-pgate-${{ matrix.name }}-0
          path: out/
          retention-days: 14

  report:
    needs: [plan, run, gate, pgate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gh, not download-artifact: download-artifact unpacks a lone matching
      # artifact straight into res/, and report.py finds each leg by its
      # r-<leg>-<name>-<k> folder. gh keeps one folder per artifact.
      - name: Download the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'r-*' -D res || mkdir -p res
      - name: Report
        run: |
          python3 report.py res > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
      - uses: actions/upload-artifact@v7
        with:
          name: report-${{ needs.plan.outputs.label }}
          path: |
            report.md
            res/
          retention-days: 30
