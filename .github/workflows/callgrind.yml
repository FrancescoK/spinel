name: callgrind
# Instruction counts (callgrind Ir) for optcarrot and selected benchmarks,
# BASE vs HEAD, as matz asked for on #6179. Edit callgrind.conf and push,
# or dispatch by hand.
on:
  push:
    branches: [callgrind]
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Read callgrind.conf
        run: grep -E '^[A-Z]+=' callgrind.conf >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Fetch optcarrot
        run: git clone -q --depth=1 --branch=experiment/spinel https://github.com/mame/optcarrot.git "$RUNNER_TEMP/oc"
      - name: Build and measure
        run: |
          set -e
          measure () {
            side=$1; sha=$2; d="$RUNNER_TEMP/s-$side"
            git clone -q --filter=blob:none https://github.com/matz/spinel.git "$d"
            cd "$d"
            git remote add fork https://github.com/FrancescoK/spinel.git
            git fetch -q origin "$sha" 2>/dev/null || git fetch -q fork "$sha" 2>/dev/null || git fetch -q fork
            git checkout -q "$sha"
            echo "$side $(git rev-parse --short HEAD) $(git log -1 --format=%s)" >> "$RUNNER_TEMP/revs.txt"
            make deps >/dev/null && make -j"$(nproc)" all >/dev/null
            mkdir -p build && cp -a "$RUNNER_TEMP/oc" build/optcarrot
            make optcarrot OPTCARROT_RUNS=1 | tail -2
            valgrind --tool=callgrind --callgrind-out-file="$RUNNER_TEMP/cg/optcarrot-$side.cg" ./build/optcarrot-single > "$RUNNER_TEMP/oc-$side.out" 2> "$RUNNER_TEMP/oc-$side.vg"
            grep -q '^checksum: 59662$' "$RUNNER_TEMP/oc-$side.out" || { echo "optcarrot checksum wrong on $side"; exit 1; }
            ir=$(grep -o 'Collected : [0-9]*' "$RUNNER_TEMP/oc-$side.vg" | grep -o '[0-9]*$')
            echo "optcarrot $side $ir" >> "$RUNNER_TEMP/ir.txt"
            list="$BENCHES"; [ "$list" = all ] && list=$(ls benchmark/*.rb | xargs -n1 basename | sed 's/\.rb$//')
            for b in $list; do
              [ -f "benchmark/$b.rb" ] || continue
              ./spinel "benchmark/$b.rb" -o "$RUNNER_TEMP/$b-$side" >/dev/null 2>&1 || { echo "$b $side build-failed" >> "$RUNNER_TEMP/ir.txt"; continue; }
              valgrind --tool=callgrind --callgrind-out-file="$RUNNER_TEMP/cg/$b-$side.cg" "$RUNNER_TEMP/$b-$side" > /dev/null 2> "$RUNNER_TEMP/$b-$side.vg" || true
              ir=$(grep -o 'Collected : [0-9]*' "$RUNNER_TEMP/$b-$side.vg" | grep -o '[0-9]*$')
              echo "$b $side ${ir:-none}" >> "$RUNNER_TEMP/ir.txt"
            done
            cd - >/dev/null
          }
          mkdir -p "$RUNNER_TEMP/cg"
          measure base "$BASE"
          measure head "$HEAD"
      - name: Summary
        run: |
          {
            echo "## callgrind: $LABEL"
            echo; sed 's/^/    /' "$RUNNER_TEMP/revs.txt"; echo
            echo "| program | base Ir | head Ir | head/base |"
            echo "|---|---:|---:|---:|"
            awk '{ ir[$1" "$2]=$3; if (!seen[$1]++) order[++n]=$1 }
                 END { for (i=1;i<=n;i++) { p=order[i]; b=ir[p" base"]; h=ir[p" head"];
                   r=(b+0>0 && h+0>0) ? sprintf("%.4f", h/b) : "-";
                   printf "| %s | %s | %s | %s |\n", p, b, h, r } }' "$RUNNER_TEMP/ir.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/summary.md"
          cp "$RUNNER_TEMP/ir.txt" "$RUNNER_TEMP/revs.txt" .
          mkdir -p annotate
          for f in "$RUNNER_TEMP"/cg/*.cg; do
            n=$(basename "$f" .cg)
            callgrind_annotate --inclusive=no --threshold=99 "$f" 2>/dev/null | head -60 > "annotate/$n.txt" || true
          done
      - uses: actions/upload-artifact@v7
        with:
          name: callgrind-${{ env.LABEL }}
          path: |
            ir.txt
            revs.txt
            annotate/
