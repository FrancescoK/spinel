name: restore-spinel-c-files
on:
  workflow_dispatch:
  push:
    paths:
      - '.cursor-restore/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/arysub-typed-gaps-0320
          fetch-depth: 0
      - name: Inflate payloads
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, hashlib, pathlib, glob
          root = pathlib.Path('.cursor-restore')
          mapping = {
            'builtin_ops.c.gz.b64': ('src/builtin_ops.c', 'aa77fe279f41759bd71f48aaecfb6d6ed626476397f14001a9f93cf01877d019'),
            'codegen_expr.c.gz.b64': ('src/codegen_expr.c', '6bc1579b1be111efaaffb3e7825181fe85533c37ed230bce7194c3166e73671c'),
          }
          for stem, (dst, expect) in mapping.items():
            single = root / stem
            if single.exists():
              text = single.read_text()
            else:
              parts = sorted(root.glob(stem + '.part*'))
              if not parts:
                print('skip missing', stem)
                continue
              text = ''.join(p.read_text() for p in parts)
              print('concat', stem, 'from', [p.name for p in parts], 'len', len(text))
            raw = gzip.decompress(base64.b64decode(text.encode()))
            got = hashlib.sha256(raw).hexdigest()
            assert got == expect, (stem, got, expect)
            pathlib.Path(dst).write_bytes(raw)
            print('restored', dst, len(raw), got)
          PY
      - name: Commit and push
        run: |
          git config user.name "cursor-restore"
          git config user.email "cursoragent@cursor.com"
          git add src/builtin_ops.c src/codegen_expr.c
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Array subclass typed poly empty? and != match CRuby

          Restored via inflate of .cursor-restore payloads.

          Co-Authored-By: Cursor Agent <cursoragent@cursor.com>
          EOF
          )"
          git push origin HEAD:cursor/arysub-typed-gaps-0320
