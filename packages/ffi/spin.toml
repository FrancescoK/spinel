[package]
name = "ffi"
sources = ["sp_ffi.c"]   # carried C is declared, not discovered (#4362)

# Pre-installed spin package: ships with the compiler, versioned with it.
# The ffi gem's API in Ruby (ffi.rb) over libffi and dlopen glue (sp_ffi.c).
# -lffi reaches the link line only through ffi.rb's `ffi_lib`, which is parsed
# only when `require "ffi"` splices it.
