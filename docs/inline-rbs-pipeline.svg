<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
<title id="title">Inline RBS in the Spinel pipeline</title>
<desc id="desc">Ruby source is parsed with Prism. Inline RBS annotations attach to exact AST nodes, declarations are registered, then annotation types and independent external RBS seeds enter existing type pin helpers before the inference fixpoint. Spinel generates C, compiles it, and produces a native executable. Unsupported annotations warn and are ignored individually; malformed or conflicting annotations stop compilation. The global opt-out and missing-parser build skip inline annotations while leaving external RBS independent.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8c9aaa"/></marker>
<marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7760a8"/></marker>
</defs>
<rect width="1600" height="870" fill="#f7f8fa"/>
<text x="64" y="74" fill="#172334" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">
<tspan x="64" dy="0">Inline RBS in the Spinel pipeline</tspan>
</text>
<text x="64" y="115" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">
<tspan x="64" dy="0">Inline comments attach to Ruby nodes, then reuse RBS pins before inference.</tspan>
</text>
