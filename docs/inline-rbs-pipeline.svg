</text>
<text x="64" y="689" fill="#116148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">
<tspan x="64" dy="0">Supported</tspan>
</text>
<text x="64" y="717" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="64" dy="0">Apply its type pins.</tspan>
</text>
<text x="557" y="689" fill="#996d21" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">
<tspan x="557" dy="0">Unsupported</tspan>
</text>
<text x="557" y="717" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="557" dy="0">Warn; ignore that annotation.</tspan>
<tspan x="557" dy="23.8">Other annotations still apply.</tspan>
</text>
<text x="1050" y="689" fill="#ac4960" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">
<tspan x="1050" dy="0">Malformed or conflicting</tspan>
</text>
<text x="1050" y="717" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="1050" dy="0">Stop with a located compile error.</tspan>
</text>
<path d="M 516,675 L 516,746" fill="none" stroke="#cbd4df" stroke-width="1.8" stroke-linejoin="round"  />
<path d="M 1009,675 L 1009,746" fill="none" stroke="#cbd4df" stroke-width="1.8" stroke-linejoin="round"  />
<rect x="64" y="786" width="1472" height="61" rx="8" fill="#edf0f5" stroke="none" stroke-width="1.5"/>
<text x="84" y="811" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">
<tspan x="84" dy="0">Global skip: --no-inline-rbs skips inline processing. A build without the RBS parser warns once and skips inline annotations.</tspan>
<tspan x="84" dy="22.4">External --rbs remains independent. The compiler still infers types and generates a native program.</tspan>
</text>
