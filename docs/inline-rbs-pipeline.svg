<text x="84" y="353" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="84" dy="0">01</tspan>
</text>
<text x="84" y="383" fill="#172334" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">
