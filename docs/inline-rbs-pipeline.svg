<tspan x="973" dy="0">Repeat until stable</tspan>
</text>
<path d="M 64,623 L 1536,623" fill="none" stroke="#cbd4df" stroke-width="1.8" stroke-linejoin="round"  />
<text x="64" y="654" fill="#172334" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">
