<tspan x="710" dy="0">.rbs files</tspan>
</text>
<text x="710" y="231" fill="#7760a8" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="710" dy="0">--rbs DIR</tspan>
</text>
<text x="710" y="253" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle">
<tspan x="710" dy="0">Existing extractor</tspan>
</text>
