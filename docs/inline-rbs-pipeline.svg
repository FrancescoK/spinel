<text x="310" y="450" fill="#116148" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">
<tspan x="310" dy="0">1  Attach annotations</tspan>
<tspan x="310" dy="22.4">    to exact AST nodes</tspan>
</text>
<text x="300" y="511" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
