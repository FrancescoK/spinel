<text x="1398" y="353" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">
<tspan x="1398" dy="0">06</tspan>
</text>
<text x="1398" y="383" fill="#172334" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="start">
<tspan x="1398" dy="0">Executable</tspan>
</text>
<text x="84" y="427" fill="#5c6b7d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
