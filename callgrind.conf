# Two spinel commits to compare under callgrind. Each is a sha (or branch)
# of matz/spinel or of FrancescoK/spinel. BENCHES is a space-separated list
# of benchmark/ names without .rb, or "all". LABEL names the run.
# REPEAT (default 1) measures each benchmark that many times per side.
# Optional: BASE_ENV / HEAD_ENV (NAME=value pairs for that side's spinel compiles)
# and FPS_PAIRS (alternating optcarrot fps pairs); see callgrind.yml. Remove them after use.
