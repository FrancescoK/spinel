# Two spinel commits to compare under callgrind. Each is a sha (or branch)
# of matz/spinel or of FrancescoK/spinel. BENCHES is a space-separated list
# of benchmark/ names without .rb, or "all". LABEL names the run.
# REPEAT (default 1) measures each benchmark that many times per side.
# Optional: BASE_ENV / HEAD_ENV (NAME=value pairs for that side's spinel compiles)
# and FPS_PAIRS (alternating optcarrot fps pairs); see callgrind.yml. Remove them after use.
# Noise check: bm_threaded_render, base vs NPF12b, 5 runs each (rerun: a missing Ir no longer aborts).
LABEL=PERFB1c9
BASE=a2bd890054b6790af454cbd78056107b11338396
HEAD=e33270b77162f930b065e71205bd87d75ec696d3
BENCHES=optcarrot bm_ao_render bm_binary_trees bm_gcbench bm_huffman bm_micro_lisp bm_poly_cells bm_rbtree bm_reader_index bm_sinatra_mini bm_stark_field bm_template bm_threaded_render bm_tree_walker bm_tree_walker_frames
REPEAT=1
